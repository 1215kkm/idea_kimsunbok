name: CI - Build & Lint

on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit --pretty
        continue-on-error: true

      - name: ESLint
        run: npm run lint -- --max-warnings 50
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Build status
        if: success()
        run: echo "✅ Build succeeded"

      - name: Build failed
        if: failure()
        run: echo "❌ Build failed - check logs above"

  pr-review-comment:
    needs: build-and-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment build result
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            const buildJob = checks.check_runs.find(c => c.name === 'build-and-lint');
            const status = buildJob?.conclusion === 'success' ? '✅ 빌드 성공' : '❌ 빌드 실패';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI 결과\n${status}\n\n자동 생성된 코멘트입니다.`
            });
