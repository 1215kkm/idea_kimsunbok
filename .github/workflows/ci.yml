name: CI - Build & Auto Review

on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        id: typecheck
        run: npx tsc --noEmit --pretty 2>&1 | tee /tmp/typecheck.log
        continue-on-error: true

      - name: ESLint
        id: lint
        run: npm run lint -- --max-warnings 50 2>&1 | tee /tmp/lint.log
        continue-on-error: true

      - name: Build
        id: build
        run: npm run build

      - name: UI rule check - text-white on light bg
        id: ui-check
        run: |
          echo "🔍 라이트모드 UI 규칙 검사..."
          VIOLATIONS=""

          for f in $(find src/app -name "*.tsx" -not -path "*/node_modules/*"); do
            # text-white가 있는데 bg-gradient나 from-[#3B4CCA] 없는 라인 찾기
            while IFS= read -r line; do
              if echo "$line" | grep -q "text-white" && \
                 ! echo "$line" | grep -qE "(bg-gradient|from-\[#|bg-\[#3B4CCA\]|bg-\[#2D3A8C\])"; then
                VIOLATIONS="${VIOLATIONS}\n⚠️ ${f}: ${line}"
              fi
            done < "$f"
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "⚠️ 라이트모드 text-white 위반 가능성:"
            echo -e "$VIOLATIONS"
            echo "ui_warnings=true" >> $GITHUB_OUTPUT
          else
            echo "✅ UI 규칙 위반 없음"
            echo "ui_warnings=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

  auto-review-and-merge:
    needs: build-and-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate review report
        id: report
        run: |
          cat << 'REPORT' > /tmp/review.md
          ## 🤖 자동 코드 리뷰 결과

          | 항목 | 결과 |
          |------|------|
          | 빌드 | ${{ needs.build-and-lint.result == 'success' && '✅ 성공' || '❌ 실패' }} |
          | 전체 상태 | ${{ needs.build-and-lint.result == 'success' && '🟢 통과' || '🔴 실패' }} |

          REPORT

          if [ "${{ needs.build-and-lint.result }}" = "success" ]; then
            echo "---" >> /tmp/review.md
            echo "✅ **모든 검사 통과 → 자동 머지 진행합니다.**" >> /tmp/review.md
          else
            echo "---" >> /tmp/review.md
            echo "❌ **빌드 실패 → 수정 후 다시 push 해주세요.**" >> /tmp/review.md
          fi

      - name: Comment review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Auto-merge if build passed
        if: needs.build-and-lint.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // PR 승인 시도 (GITHUB_TOKEN 권한 제한으로 실패할 수 있음)
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: '✅ 자동 리뷰 통과 - 빌드 성공'
              });
              console.log('✅ 자동 승인 완료');
            } catch (e) {
              console.log('⚠️ 자동 승인 실패 (권한 제한):', e.message);
            }

            // 머지 시도
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `${context.payload.pull_request.title} (#${prNumber})`
              });
              console.log('✅ 자동 머지 완료');
            } catch (e) {
              console.log('⚠️ 자동 머지 실패:', e.message);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ 자동 머지 실패: ${e.message}\nCowork의 수동 리뷰 & 머지가 필요합니다.`
              });
            }

      - name: Request changes if build failed
        if: needs.build-and-lint.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'REQUEST_CHANGES',
                body: '❌ 빌드 실패 - 로그를 확인하고 수정해주세요.'
              });
            } catch (e) {
              console.log('⚠️ 리뷰 작성 실패:', e.message);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '❌ 빌드 실패 - 로그를 확인하고 수정해주세요.'
              });
            }
